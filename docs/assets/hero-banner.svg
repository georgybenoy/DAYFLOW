<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040908" />
      <stop offset="50%" stop-color="#071410" />
      <stop offset="100%" stop-color="#0B1C17" />
    </linearGradient>
    
    <!-- Mint Glow Gradient -->
    <radialGradient id="mint-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#A5E6D6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#A5E6D6" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#07120F" stop-opacity="0" />
    </radialGradient>

    <!-- Lavender Accent Glow -->
    <radialGradient id="lavender-glow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#DCC3F5" stop-opacity="0.20" />
      <stop offset="70%" stop-color="#DCC3F5" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#07120F" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Gradients -->
    <linearGradient id="ring-mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5E6D6" />
      <stop offset="100%" stop-color="#76CDBB" />
    </linearGradient>

    <linearGradient id="ring-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E99B" />
      <stop offset="100%" stop-color="#D4CD77" />
    </linearGradient>

    <linearGradient id="ring-lavender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCC3F5" />
      <stop offset="100%" stop-color="#B798D8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261F" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E1A15" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="440" fill="url(#bg-grad)" />
  <rect width="1200" height="440" fill="url(#mint-glow)" />
  <rect width="1200" height="440" fill="url(#lavender-glow)" />

  <!-- Subtle Ambient Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="88" x2="1200" y2="88" />
    <line x1="0" y1="176" x2="1200" y2="176" />
    <line x1="0" y1="264" x2="1200" y2="264" />
    <line x1="0" y1="352" x2="1200" y2="352" />
    <line x1="240" y1="0" x2="240" y2="440" />
    <line x1="480" y1="0" x2="480" y2="440" />
    <line x1="720" y1="0" x2="720" y2="440" />
    <line x1="960" y1="0" x2="960" y2="440" />
  </g>

  <!-- Left Side: Brand & Hero Typography -->
  <g transform="translate(80, 75)">
    <!-- Brand Pill Tag -->
    <g>
      <rect width="210" height="30" rx="15" fill="#A5E6D6" fill-opacity="0.12" stroke="#A5E6D6" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="16" cy="15" r="4" fill="#A5E6D6" filter="url(#neon-glow)" />
      <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#A5E6D6">100% OFFLINE-FIRST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5" fill="#FFFFFF">
      DAYFLOW<tspan fill="#A5E6D6">.</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="600" letter-spacing="3.5" fill="#A5E6D6">
      MAKE TODAY COUNT
    </text>

    <!-- Description Paragraph -->
    <text x="2" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400" fill="#9FB5AA" opacity="0.9">
      Personal productivity and deterministic daily execution system.
    </text>
    <text x="2" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="400" fill="#9FB5AA" opacity="0.9">
      Zero backend • Zero cloud sync • Zero AI gimmicks • 100% Privacy.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 220)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="32" rx="10" fill="#11221B" stroke="#263A32" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#E2EAE5">⚡ Daily Planner</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(145, 0)">
        <rect width="135" height="32" rx="10" fill="#11221B" stroke="#263A32" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#E2EAE5">🔥 Habit Engine</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(290, 0)">
        <rect width="145" height="32" rx="10" fill="#11221B" stroke="#263A32" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#E2EAE5">🔔 Exact Alarms</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Visual Graphic / Glassmorphic Card Showcase -->
  <g transform="translate(740, 50)" filter="url(#subtle-shadow)">
    <!-- Decorative Floating Card -->
    <rect width="380" height="330" rx="28" fill="url(#card-grad)" stroke="#263A32" stroke-width="1.5" />
    
    <!-- Inner Card Header -->
    <g transform="translate(28, 28)">
      <rect width="36" height="36" rx="12" fill="#A5E6D6" fill-opacity="0.1" stroke="#A5E6D6" stroke-opacity="0.2" />
      <path d="M18 10L20 16L26 18L20 20L18 26L16 20L10 18L16 16Z" fill="#A5E6D6" />
      <text x="48" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#A5E6D6">EXECUTION INDEX</text>
      <text x="48" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="500" fill="#889E93">Today's Performance</text>
    </g>

    <!-- Concentric Progress Rings Graphic -->
    <g transform="translate(190, 165)">
      <!-- Outer Track: Tasks -->
      <circle cx="0" cy="0" r="68" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8" />
      <circle cx="0" cy="0" r="68" fill="none" stroke="url(#ring-mint)" stroke-width="8" stroke-dasharray="427" stroke-dashoffset="85" stroke-linecap="round" transform="rotate(-90)" />

      <!-- Middle Track: Habits -->
      <circle cx="0" cy="0" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8" />
      <circle cx="0" cy="0" r="54" fill="none" stroke="url(#ring-yellow)" stroke-width="8" stroke-dasharray="339" stroke-dashoffset="68" stroke-linecap="round" transform="rotate(-90)" />

      <!-- Inner Track: Reminders -->
      <circle cx="0" cy="0" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8" />
      <circle cx="0" cy="0" r="40" fill="none" stroke="url(#ring-lavender)" stroke-width="8" stroke-dasharray="251" stroke-dashoffset="25" stroke-linecap="round" transform="rotate(-90)" />

      <!-- Center Score -->
      <text x="0" y="8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">88</text>
      <text x="0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="8" font-weight="700" letter-spacing="1.5" fill="#889E93">SCORE</text>
    </g>

    <!-- Bottom Mini Stats Row -->
    <g transform="translate(28, 258)">
      <line x1="0" y1="0" x2="324" y2="0" stroke="#263A32" stroke-width="1" />
      
      <!-- Stat 1 -->
      <g transform="translate(10, 16)">
        <circle cx="6" cy="6" r="3" fill="#A5E6D6" />
        <text x="16" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Tasks (80%)</text>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#889E93">4 of 5 completed</text>
      </g>

      <!-- Stat 2 -->
      <g transform="translate(125, 16)">
        <circle cx="6" cy="6" r="3" fill="#F0E99B" />
        <text x="16" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Habits (80%)</text>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#889E93">🔥 5d streak</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(235, 16)">
        <circle cx="6" cy="6" r="3" fill="#DCC3F5" />
        <text x="16" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Alarms (90%)</text>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#889E93">Exact scheduled</text>
      </g>
    </g>
  </g>
</svg>
